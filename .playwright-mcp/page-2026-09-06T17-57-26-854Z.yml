            - text: with qualifying American Express, Axis Bank and ICICI Bank cards only. Minimum transaction value of ₹10001 applies.
            - link "Click here" [ref=e196] [cursor=pointer]:
              - /url: /in/shop/ways-to-buy
            - text: to see instant cashback amounts and eligible devices. Instant cashback is available for up to two orders per rolling 90-day period with an eligible card. Card eligibility is subject to terms and conditions between you and your card issuer. Total transaction value is calculated after any trade-in credit or eligible discount is applied. Any subsequent order adjustment(s) or cancellation(s) may result in instant cashback being recalculated, and any refund may be adjusted to account for instant cashback clawback; this may result in no refund being made to you. Offer may be revised or withdrawn at any time without any prior notice.
            - link "Additional terms apply" [ref=e197] [cursor=pointer]:
